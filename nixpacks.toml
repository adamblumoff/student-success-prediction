[providers]
python = "3.11"

[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]  
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = ["echo 'Build phase complete - database setup will run at startup'"]

[start]
cmd = "python scripts/direct_db_setup.py || true && python run_mvp.py"